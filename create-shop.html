<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Your Shop - Shopy Easy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Shopy Easy
    </div>

    <a href="index.html" class="back-home">
        ← Back to Home
    </a>

</header>


<section class="form-section">

    <div class="form-box">

        <h1>Create Your Digital Shop</h1>

        <p>
            Add your shop information, photos, menu and location.
        </p>


        <form id="shopForm">

            <!-- =========================
                 SHOP INFORMATION
            ========================== -->

            <h2>Shop Information</h2>


            <label for="shopName">
                Shop Name
            </label>

            <input
                type="text"
                id="shopName"
                placeholder="Example: Rahul Cafe"
                required
            >


            <label for="ownerName">
                Owner Name
            </label>

            <input
                type="text"
                id="ownerName"
                placeholder="Enter owner name"
                required
            >


            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter mobile number"
                required
            >


            <label for="category">
                Shop Category
            </label>

            <select id="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Restaurant">
                    Restaurant
                </option>

                <option value="Cafe">
                    Cafe
                </option>

                <option value="Clothing Shop">
                    Clothing Shop
                </option>

                <option value="Grocery Store">
                    Grocery Store
                </option>

                <option value="Mobile Shop">
                    Mobile Shop
                </option>

                <option value="Salon">
                    Salon
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- =========================
                 LOCATION
            ========================== -->

            <h2>Shop Location</h2>


            <label for="address">
                Shop Address
            </label>

            <textarea
                id="address"
                placeholder="Enter complete shop address"
                rows="4"
                required
            ></textarea>


            <label for="maps">
                Google Maps Link
            </label>

            <input
                type="text"
                id="maps"
                placeholder="Paste Google Maps link"
            >


            <!-- =========================
                 TIMING
            ========================== -->

            <h2>Shop Timing</h2>


            <label for="openingTime">
                Opening Time
            </label>

            <input
                type="time"
                id="openingTime"
            >


            <label for="closingTime">
                Closing Time
            </label>

            <input
                type="time"
                id="closingTime"
            >


            <!-- =========================
                 FACILITIES
            ========================== -->

            <h2>Shop Facilities</h2>


            <div class="facilities">

                <label>
                    <input
                        type="checkbox"
                        value="WiFi"
                    >
                    WiFi
                </label>


                <label>
                    <input
                        type="checkbox"
                        value="Parking"
                    >
                    Parking
                </label>


                <label>
                    <input
                        type="checkbox"
                        value="Home Delivery"
                    >
                    Home Delivery
                </label>


                <label>
                    <input
                        type="checkbox"
                        value="Online Payment"
                    >
                    Online Payment
                </label>


                <label>
                    <input
                        type="checkbox"
                        value="AC"
                    >
                    AC
                </label>


                <label>
                    <input
                        type="checkbox"
                        value="UPI"
                    >
                    UPI Payment
                </label>

            </div>


            <!-- =========================
                 PHOTOS
            ========================== -->

            <h2>Shop Photos</h2>


            <p class="upload-info">
                Add photos of your shop, products,
                menu card, visiting card and other
                useful images.
            </p>


            <label for="shopPhotos">
                Shop / Store Photos
            </label>

            <input
                type="file"
                id="shopPhotos"
                accept="image/*"
                multiple
            >


            <label for="menuPhotos">
                Menu Card Photos
            </label>

            <input
                type="file"
                id="menuPhotos"
                accept="image/*"
                multiple
            >


            <label for="visitingCard">
                Visiting Card
            </label>

            <input
                type="file"
                id="visitingCard"
                accept="image/*"
                multiple
            >


            <label for="otherPhotos">
                Other Photos
            </label>

            <input
                type="file"
                id="otherPhotos"
                accept="image/*"
                multiple
            >


            <!-- =========================
                 CREATE SHOP BUTTON
            ========================== -->

            <button
                type="submit"
                class="primary-btn create-btn"
            >
                Create My Shop
            </button>

        </form>

    </div>

</section>


<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="script.js"></script>


</body>
</html>
